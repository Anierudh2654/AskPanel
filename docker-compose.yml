services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: askpanel
      POSTGRES_PASSWORD: askpanel
      POSTGRES_DB: askpanel
    ports:
      - "5432:5432"
    volumes:
      - askpanel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askpanel -d askpanel"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  askpanel-postgres:
